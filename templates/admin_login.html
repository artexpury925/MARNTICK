{% extends "base.html" %}
{% block title %}Admin Login · MARNTICK{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="glass rounded-2xl p-8 w-full max-w-md glow border-red-500/30">
        <div class="text-center mb-8">
            <i class="fas fa-user-shield text-4xl text-red-400 mb-3"></i>
            <h1 class="text-2xl font-bold text-red-300">Admin Access</h1>
            <p class="text-gray-400 text-sm mt-1">Restricted area</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Admin Username</label>
                <input type="text" name="username" required
                       class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none transition"
                       placeholder="Admin username">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Admin Password</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none transition"
                       placeholder="Admin password">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-semibold py-3 rounded-xl transition">
                <i class="fas fa-lock mr-2"></i>Enter Admin Panel
            </button>
        </form>
    </div>
</div>
{% endblock %}
