{% extends "base.html" %}
{% block title %}Login · MARNTICK{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="glass rounded-2xl p-8 w-full max-w-md glow">
        <h1 class="text-2xl font-bold text-center mb-6">
            <i class="fas fa-sign-in-alt text-cyan-400 mr-2"></i>Login
        </h1>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="Enter username">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="Enter password">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition btn-glow">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-400 space-y-2">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="text-cyan-400 hover:underline">Register</a></p>
            <p><a href="{{ url_for('forgot_password') }}" class="text-indigo-400 hover:underline">Forgot Password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
