{% extends "base.html" %}
{% block title %}Register · MARNTICK{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="glass rounded-2xl p-8 w-full max-w-md glow">
        <h1 class="text-2xl font-bold text-center mb-6">
            <i class="fas fa-user-plus text-cyan-400 mr-2"></i>Create Account
        </h1>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required minlength="3"
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="Choose a username">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email or Phone Number</label>
                <input type="text" name="email_or_phone" required
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="email@example.com or 07XXXXXXXX">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="At least 6 characters">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required
                       class="w-full bg-slate-900/70 border border-slate-700 rounded-xl px-4 py-3 input-focus outline-none"
                       placeholder="Repeat password">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition btn-glow">
                Create Account
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400">
            Already have an account? <a href="{{ url_for('login') }}" class="text-cyan-400 hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
